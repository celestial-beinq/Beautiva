<header
  class="nav-shell"
  [class.nav-shell--transparent]="isTransparentHero()"
  [class.nav-shell--solid]="!isTransparentHero()"
>
  <div class="container nav-inner">
    <a routerLink="/" class="brand" (click)="closeMobile()">
      <span class="brand-name">BEAUTIVA</span>
    </a>

    <nav class="nav-links" aria-label="Primary">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
      <a routerLink="/about" routerLinkActive="is-active">About</a>
      <a routerLink="/vendors" routerLinkActive="is-active">Vendors</a>
      <a routerLink="/track" routerLinkActive="is-active">Tracking</a>
      <a routerLink="/contact" routerLinkActive="is-active">Contact</a>
    </nav>

    <div class="nav-actions">
      <a
        routerLink="/vendors"
        class="btn btn--sm nav-cta"
        [class.btn--white]="isTransparentHero()"
        [class.btn--primary]="!isTransparentHero()"
      >
        Book a session →
      </a>

      <button
        type="button"
        class="menu-btn"
        aria-label="Toggle menu"
        [attr.aria-expanded]="mobileOpen()"
        (click)="toggleMobile()"
      >
        {{ mobileOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div class="mobile-drawer">
      <a routerLink="/" (click)="closeMobile()">Home</a>
      <a routerLink="/about" (click)="closeMobile()">About</a>
      <a routerLink="/vendors" (click)="closeMobile()">Vendors</a>
      <a routerLink="/category/hairdressers" (click)="closeMobile()">Hairdressers</a>
      <a routerLink="/category/barbers" (click)="closeMobile()">Barbers</a>
      <a routerLink="/category/nail-technicians" (click)="closeMobile()">Nail Technicians</a>
      <a routerLink="/category/lash-technicians" (click)="closeMobile()">Lash Technicians</a>
      <a routerLink="/category/makeup-artists" (click)="closeMobile()">Makeup Artists</a>
      <a routerLink="/category/tattoo-artists" (click)="closeMobile()">Tattoo Artists</a>
      <a routerLink="/track" (click)="closeMobile()">Tracking</a>
      <a routerLink="/contact" (click)="closeMobile()">Contact</a>
      <a routerLink="/vendor" (click)="closeMobile()">Vendor Dashboard</a>
      <a routerLink="/admin" (click)="closeMobile()">Super Admin Console</a>
    </div>
  }
</header>
