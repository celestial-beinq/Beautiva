<header class="site-header">
  <div class="container">
    <nav class="nav-bar" aria-label="Primary Navigation">
      <div class="nav-links-desktop">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          (click)="closeMobile()"
        >
          Home
        </a>
        <a routerLink="/about" routerLinkActive="is-active" class="nav-link" (click)="closeMobile()">
          About
        </a>
        <a routerLink="/vendors" routerLinkActive="is-active" class="nav-link" (click)="closeMobile()">
          Vendors
        </a>
        <a routerLink="/track" routerLinkActive="is-active" class="nav-link" (click)="closeMobile()">
          Tracking
        </a>
        <a routerLink="/contact" routerLinkActive="is-active" class="nav-link" (click)="closeMobile()">
          Contact
        </a>
      </div>

      <a routerLink="/" class="nav-brand" aria-label="Beautiva Home" (click)="closeMobile()">
        <span class="brand-name">BEAUTIVA</span>
      </a>

      <div class="nav-actions">
        <a routerLink="/vendor" routerLinkActive="is-active" class="nav-link nav-portal-link" (click)="closeMobile()">
          Vendor
        </a>
        <a routerLink="/admin" routerLinkActive="is-active" class="nav-link nav-portal-link" (click)="closeMobile()">
          Admin
        </a>
        <a routerLink="/vendors" class="btn btn--primary nav-cta" (click)="closeMobile()">
          Book a session
        </a>

        <button
          type="button"
          class="mobile-toggle"
          aria-label="Toggle Menu"
          [attr.aria-expanded]="mobileOpen()"
          (click)="toggleMobile()"
        >
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    @if (mobileOpen()) {
      <div class="mobile-drawer">
        <a routerLink="/" class="mobile-link" (click)="closeMobile()">Home</a>
        <a routerLink="/about" class="mobile-link" (click)="closeMobile()">About</a>
        <a routerLink="/vendors" class="mobile-link" (click)="closeMobile()">Vendors</a>
        <a routerLink="/track" class="mobile-link" (click)="closeMobile()">Tracking</a>
        <a routerLink="/contact" class="mobile-link" (click)="closeMobile()">Contact</a>
        <a routerLink="/vendor" class="mobile-link" (click)="closeMobile()">Vendor Dashboard</a>
        <a routerLink="/admin" class="mobile-link" (click)="closeMobile()">Super Admin</a>
        <a routerLink="/vendors" class="btn btn--primary mobile-cta" (click)="closeMobile()">
          Book a session
        </a>
      </div>
    }
  </div>
</header>
