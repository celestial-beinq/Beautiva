<article class="biz-card">
  <a [routerLink]="['/business', business().slug]" class="biz-card-link" [attr.aria-label]="'Visit ' + business().name">
    <img [src]="business().coverImage" [alt]="business().name" class="biz-cover" loading="lazy" />

    <div class="biz-info-card">
      <div class="biz-title-col">
        <h3 class="biz-name">{{ business().name }}</h3>
        <p class="biz-subtitle">
          {{ business().categoryLabel }}@if (business().location) { · {{ business().location }} }
        </p>
      </div>

      <span class="biz-action-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17 17 7" />
          <path d="M9 7h8v8" />
        </svg>
      </span>
    </div>
  </a>
</article>
